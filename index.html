<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Johan - Risk Engineer Resume</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* General styles and font setup */
        :root {
            --font-sans: 'Inter', sans-serif;
        }
        body {
            font-family: var(--font-sans);
            scroll-behavior: smooth;
        }

        /* Print-specific CSS */
        @media print {
            /* Ensures no unwanted breaks/margins in print */
            @page { margin: 1.0cm; }
            body, #root { 
                background: white !important; 
                color: black !important; 
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: auto !important;
                overflow: visible !important;
            }
            /* Hide interactive elements */
            nav, footer, button, .print-hidden, .print\:hidden { 
                display: none !important; 
            }
            /* Styling for printed content */
            h1, h2, h3 { break-after: avoid; }
            p, li { orphans: 3; widows: 3; }
            .experience-item {
                break-inside: avoid;
            }
            .experience-item .sm\:col-span-3 {
                width: 33.3333%;
            }
            .experience-item .sm\:col-span-9 {
                width: 66.6667%;
            }
            /* Force the time period column to be smaller in print */
            .print-time {
                width: 120px;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body class="transition-colors duration-300 bg-slate-50 text-slate-800 font-sans print:bg-white print:text-black" data-theme="light">
    <div id="app">

                        <span class="font-bold text-lg hidden sm:block">Amar Johan</span>

                    <div id="desktop-menu" class="hidden md:flex items-center space-x-8">

        <!-- Print Instruction Modal -->

                        >

                            Proceed to Print

        <!-- Main Content -->
        <main class="pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto print:pt-0 print:px-0 print:max-w-full print:w-full">

                },

                    items: ["Public Speaking (BM)", "Technical Reporting", "Stakeholder Management", "Project Coordination", "Problem Solving"]
                },

        };

        let isDarkMode = false;
        let isMenuOpen = false;
        let activeSection = 'summary';

        // --- Utility Functions ---

        /**
         * Generates Lucide SVG markup for an icon.
         */
        function getIcon(name, size = 20, classes = '') {
            const icons = {
                // Simplified SVG paths for required icons
                Briefcase: '<rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>',
                GraduationCap: '<path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M12 20v-5M12 15L2 10M12 15l10-5"></path>',
                MapPin: '<path d="M12 13v10"></path><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path><circle cx="12" cy="9" r="3"></circle>',
                Mail: '<rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>',
                Phone: '<path d="M22 16.92v3.08a2 2 0 0 1-2 2A20 20 0 0 1 2 4a2 2 0 0 1 2-2h3.1a2 2 0 0 1 2 1.72l.1 2.37A2 2 0 0 1 9.25 8.78L7.5 10.5M10 14l1.75-1.75A2 2 0 0 1 14 12.55l2.35.1a2 2 0 0 1 1.7 2v3.1a2 2 0 0 1-2 2A20 20 0 0 1 4 4a2 2 0 0 1 2-2h3.1a2 2 0 0 1 2 1.72l.1 2.37A2 2 0 0 1 9.25 8.78L7.5 10.5"></path>',
                Moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>',
                Sun: '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>',
                Award: '<path d="m15.46 6.88-5.3 5.3-2.6-2.6-5.3 5.3M12 21.5l5.3-5.3m-5.3 5.3-5.3-5.3"></path><path d="M19 12a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path>',
                Cpu: '<rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><path d="M9 18h6M9 6h6M18 9v6M6 9v6"></path>',
                PenTool: '<path d="M12 19l7-7 3 3-7 7-3-3zM21.5 13.5l-3 3M22 2v-2M10 2l-8 8v8c0 2.2 1.8 4 4 4h12c2.2 0 4-1.8 4-4v-8l-8-8z"></path>',
                Globe: '<circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path>',
                CheckCircle2: '<circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path>',
                Menu: '<line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line>',
                X: '<path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>',
                Printer: '<polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect>',
                FileText: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line>'
            };

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${classes}">${icons[name]}</svg>`;
            return svg;
        }

        // --- State Management and Handlers ---

        function updateTheme() {
            const body = document.body;
            const navbar = document.getElementById('navbar');
            const toggleButton = document.getElementById('theme-toggle');

            if (isDarkMode) {
                body.classList.remove('bg-slate-50', 'text-slate-800');
                body.classList.add('bg-slate-900', 'text-slate-100');
                body.setAttribute('data-theme', 'dark');

                navbar.classList.remove('bg-white/95', 'border-slate-200');
                navbar.classList.add('bg-slate-900/95', 'border-slate-800');

                toggleButton.classList.remove('hover:bg-slate-100', 'text-slate-600');
                toggleButton.classList.add('hover:bg-slate-800', 'text-yellow-400');
                toggleButton.innerHTML = getIcon('Sun', 20);

            } else {
                body.classList.remove('bg-slate-900', 'text-slate-100');
                body.classList.add('bg-slate-50', 'text-slate-800');
                body.setAttribute('data-theme', 'light');

                navbar.classList.remove('bg-slate-900/95', 'border-slate-800');
                navbar.classList.add('bg-white/95', 'border-slate-200');

                toggleButton.classList.remove('hover:bg-slate-800', 'text-yellow-400');
                toggleButton.classList.add('hover:bg-slate-100', 'text-slate-600');
                toggleButton.innerHTML = getIcon('Moon', 20);
            }
            localStorage.setItem('darkMode', isDarkMode);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            updateTheme();
            renderContent(); // Re-render content to apply theme-dependent classes
        }

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            const mobileMenu = document.getElementById('mobile-menu');
            const menuToggle = document.getElementById('menu-toggle');

            if (isMenuOpen) {
                mobileMenu.classList.remove('hidden');
                mobileMenu.classList.add('animate-in', 'slide-in-from-top-5');
                menuToggle.innerHTML = getIcon('X', 24);
            } else {
                mobileMenu.classList.add('hidden');
                mobileMenu.classList.remove('animate-in', 'slide-in-from-top-5');
                menuToggle.innerHTML = getIcon('Menu', 24);
            }
        }

        function scrollToSection(id) {
            const element = document.getElementById(id);
            if (element) {
                window.scrollTo({
                    top: element.offsetTop - 80,
                    behavior: 'smooth'
                });
                if (isMenuOpen) {
                    toggleMenu(); // Close menu after selection
                }
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initiatePrint() {
            document.getElementById('print-modal').classList.remove('hidden');
        }

        function closePrintModal() {
            document.getElementById('print-modal').classList.add('hidden');
        }

        function executePrint() {
            closePrintModal();
            // Small delay to ensure modal is closed before print dialog opens
            setTimeout(() => {
                window.print();
            }, 300);
        }

        function handleScrollSpy() {
            const sections = ['summary', 'experience', 'education', 'skills'];
            const scrollPosition = window.scrollY + 100;
            let currentActive = activeSection;

            for (const section of sections) {
                const element = document.getElementById(section);
                if (element && element.offsetTop <= scrollPosition && (element.offsetTop + element.offsetHeight) > scrollPosition) {
                    currentActive = section;
                    break;
                }
            }
            
            if (currentActive !== activeSection) {
                activeSection = currentActive;
                updateNavStyles();
            }
        }

        function updateNavStyles() {
            const menuItems = document.querySelectorAll('#desktop-menu button, #mobile-menu button');
            menuItems.forEach(button => {
                const sectionId = button.getAttribute('data-section');
                const isItemActive = sectionId === activeSection;

                // Reset all classes
                button.className = button.className.split(' ').filter(c => 
                    !c.startsWith('text-blue-500') && 
                    !c.startsWith('bg-blue-50/10') && 
                    !c.startsWith('hover:text-blue-500')
                ).join(' ');

                // Apply active or inactive styles
                if (isItemActive) {
                    // Active style
                    button.classList.add('text-blue-500', 'bg-blue-50/10');
                } else {
                    // Inactive style
                    button.classList.add('hover:text-blue-500');
                }
                
                // Ensure base classes remain
                if (button.parentElement.id === 'desktop-menu') {
                    button.classList.add('px-3', 'py-2', 'rounded-md', 'text-sm', 'font-medium', 'transition-colors');
                } else {
                     button.classList.add('block', 'w-full', 'text-left', 'px-3', 'py-4', 'text-base', 'font-medium');
                }
            });
        }


        // --- Rendering Functions ---

        function renderHeader() {
            const info = resumeData.personalInfo;

                    <div>

        function renderSummary() {
            const summary = resumeData.personalInfo.summary;
            const cardClasses = isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-100';

            document.getElementById('summary').innerHTML = `
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-blue-600 print:text-black">
                    <span class="p-1 rounded bg-blue-100 dark:bg-blue-900/30 print:hidden">${getIcon('PenTool', 20)}</span>
                    Professional Summary
                </h2>
                <div class="p-6 rounded-2xl shadow-sm border ${cardClasses} print:shadow-none print:border-none print:p-0 print:bg-transparent">
                    <p class="leading-relaxed text-lg print:text-sm">
                        ${summary}
                    </p>
                </div>
            `;
        }

        function renderExperience() {
            const experience = resumeData.experience;
            let html = `
                <h2 class="text-2xl font-bold mb-8 flex items-center gap-2 text-blue-600 print:text-black">
                    <span class="p-1 rounded bg-blue-100 dark:bg-blue-900/30 print:hidden">${getIcon('Briefcase', 20)}</span>
                    Professional Experience
                </h2>
                <div class="space-y-12 print:space-y-6">
            `;

            experience.forEach(job => {
                const achievementList = job.achievements.map(ach => `
                    <li class="flex items-start gap-3 text-base leading-snug print:text-sm">
                        <span class="mt-1.5 text-blue-500 flex-shrink-0 print:text-black">
                            <div class="w-1.5 h-1.5 rounded-full bg-current"></div>
                        </span>
                        <span class="text-slate-700 dark:text-slate-300 print:text-gray-800">${ach}</span>
                    </li>
                `).join('');

                html += `
                    <div class="relative pl-8 sm:pl-0 break-inside-avoid experience-item">
                        <!-- Timeline Line (Hidden in print) -->
                        <div class="absolute left-0 top-2 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-900 sm:hidden print:hidden"></div>
                        <div class="absolute left-[-5px] top-2 w-3 h-3 rounded-full bg-blue-500 sm:hidden print:hidden"></div>

                        <div class="grid sm:grid-cols-12 gap-4 sm:gap-8 items-start group">
                            <div class="sm:col-span-3 text-sm font-medium sm:text-right text-slate-500 dark:text-slate-400 print:text-gray-600 print-time">
                                <div class="sticky top-24 print:static">
                                    ${job.period}
                                </div>
                            </div>
                            <div class="sm:col-span-9">
                                <h3 class="text-xl font-bold text-slate-900 dark:text-white print:text-black print:text-lg text-black">${job.role}</h3>
                                <div class="text-blue-600 font-medium mb-2 print:text-gray-800 print:text-sm">
                                    ${job.company} <span class="text-slate-400 mx-2">•</span> ${job.department}
                                </div>
                                <p class="mb-4 text-slate-600 dark:text-slate-300 italic print:text-gray-700 print:text-sm">
                                    ${job.description}
                                </p>
                                <ul class="space-y-2">
                                    ${achievementList}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            document.getElementById('experience').innerHTML = html;
        }

        function renderEducation() {
            const education = resumeData.education;
            let html = `
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-blue-600 print:text-black">
                    <span class="p-1 rounded bg-blue-100 dark:bg-blue-900/30 print:hidden">${getIcon('GraduationCap', 20)}</span>
                    Education
                </h2>
                <div class="grid md:grid-cols-2 gap-6 print:block print:space-y-6">
            `;

            education.forEach(edu => {
                const cardClasses = isDarkMode 
                    ? 'bg-slate-800/50 border-slate-700 hover:border-slate-600' 
                    : 'bg-white border-slate-100 hover:border-blue-100';
                
                const detailsHtml = edu.details ? `
                    <div class="flex items-start gap-2 mt-2">
                        <span class="mt-1">${getIcon('CheckCircle2', 14, 'text-green-500 print:hidden')}</span>
                        <span>${edu.details}</span>
                    </div>
                ` : '';

                html += `
                    <div class="p-6 rounded-2xl shadow-sm border transition-all duration-300 hover:shadow-md ${cardClasses} print:border-none print:shadow-none print:p-0 print:bg-transparent print:mb-4 break-inside-avoid">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg text-slate-900 dark:text-white print:text-black text-black">${edu.degree}</h3>
                            <span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-100 print:border print:border-gray-300 print:bg-transparent print:text-gray-700">
                                ${edu.year}
                            </span>
                        </div>
                        <div class="text-blue-600 font-medium mb-3 print:text-gray-800">${edu.institution}</div>
                        <div class="space-y-1 text-sm text-slate-600 dark:text-slate-300 print:text-gray-700">
                            <div class="flex items-center gap-2">
                                ${getIcon('CheckCircle2', 14, 'text-green-500 print:hidden')}
                                <span>${edu.grade}</span>
                            </div>
                            ${detailsHtml}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            document.getElementById('education').innerHTML = html;
        }

        function renderSkills() {
            const skills = resumeData.skills;
            let html = `
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-blue-600 print:text-black">
                    <span class="p-1 rounded bg-blue-100 dark:bg-blue-900/30 print:hidden">${getIcon('Cpu', 20)}</span>
                    Technical Skills & Proficiency
                </h2>
                <div class="grid sm:grid-cols-2 gap-6 print:grid-cols-2">
            `;

            skills.forEach(skillGroup => {
                const groupCardClasses = isDarkMode ? 'bg-slate-800/30' : 'bg-slate-50';
                const iconContainerClasses = isDarkMode ? 'bg-slate-700 text-blue-400' : 'bg-white text-blue-600 shadow-sm';
                
                const skillItems = skillGroup.items.map(skill => {
                    const skillClasses = isDarkMode 
                        ? 'bg-slate-700 text-slate-200 hover:bg-slate-600' 
                        : 'bg-white text-slate-700 shadow-sm border border-slate-100 hover:border-blue-200 hover:text-blue-600';
                    return `
                        <span 
                            class="px-3 py-1.5 rounded-md text-sm font-medium transition-all hover:scale-105 cursor-default ${skillClasses} print:bg-transparent print:border print:border-gray-300 print:text-black print:shadow-none"
                        >
                            ${skill}
                        </span>
                    `;
                }).join('');

                html += `
                    <div class="rounded-2xl p-6 ${groupCardClasses} print:bg-transparent print:p-0 print:border print:border-gray-200 print:p-4 break-inside-avoid">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="p-2 rounded-lg ${iconContainerClasses} print:hidden">
                                ${getIcon(skillGroup.iconName, 20)}
                            </div>
                            <h3 class="font-bold text-lg">${skillGroup.category}</h3>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${skillItems}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            document.getElementById('skills').innerHTML = html;
        }

        function renderNavigation() {
            const sections = ['Summary', 'Experience', 'Education', 'Skills'];
            const desktopMenu = document.getElementById('desktop-menu');
            const mobileMenuContent = document.querySelector('#mobile-menu > div');

            const menuHtml = sections.map(item => {
                const id = item.toLowerCase();
                return `
                    <button
                        data-section="${id}"
                        onclick="scrollToSection('${id}')"
                        class="px-3 py-2 rounded-md text-sm font-medium transition-colors hover:text-blue-500"
                    >
                        ${item}
                    </button>
                `;
            }).join('');
            desktopMenu.innerHTML = menuHtml;

            const mobileHtml = sections.map(item => {
                const id = item.toLowerCase();
                return `
                    <button
                        data-section="${id}"
                        onclick="scrollToSection('${id}')"
                        class="block w-full text-left px-3 py-4 text-base font-medium hover:bg-blue-50/10 hover:text-blue-500"
                    >
                        ${item}
                    </button>
                `;
            }).join('');
            mobileMenuContent.innerHTML = mobileHtml;

            // Set up mobile menu button
            const menuToggle = document.getElementById('menu-toggle');
            menuToggle.innerHTML = getIcon('Menu', 24);
            menuToggle.onclick = toggleMenu;

            updateNavStyles(); // Apply initial active style
        }

        function renderFooter() {
            const footer = document.getElementById('footer');
            const footerClass = isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-500' : 'bg-white border-slate-100 text-slate-400';
            footer.className = `py-8 text-center border-t print:hidden ${footerClass}`;
            footer.innerHTML = `
                <p class="text-sm">© ${new Date().getFullYear()} ${resumeData.personalInfo.name}. All rights reserved.</p>
                <p class="text-xs mt-2">Built with HTML, JS & Tailwind CSS</p>
            `;
        }
        
        // --- Main Render Function ---

        function renderContent() {
            renderHeader();
            renderSummary();
            renderExperience();
            renderEducation();
            renderSkills();
            renderFooter();
        }

        // --- Initialization ---

        function init() {
            // 1. Load Theme State
            const savedTheme = localStorage.getItem('darkMode');
            if (savedTheme === 'true') {
                isDarkMode = true;
            } else {
                isDarkMode = false;
            }
            updateTheme();

            // 2. Initial Render
            renderNavigation(); // Renders nav structure and attaches scroll to section events
            renderContent();    // Renders all main content sections

            // 3. Attach Listeners
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            window.addEventListener('scroll', handleScrollSpy);

            // Set up initial scroll spy status
            handleScrollSpy();
        }

        window.onload = init;
    </script>
</body>
</html>
